[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mixcheck"
version = "0.1.0"
description = "Seraphim: technical QC for mixes and masters, with AI-written engineer's notes."
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "soundfile>=0.12"]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9"]
ai = ["anthropic>=1.8"]

[project.scripts]
seraphim = "mixcheck.cli:main"
seraphim-web = "mixcheck.web.server:main"
seraphim-calibrate = "mixcheck.calibrate:main"
# The original names keep working.
mixcheck = "mixcheck.cli:main"
mixcheck-web = "mixcheck.web.server:main"
mixcheck-calibrate = "mixcheck.calibrate:main"

[tool.setuptools]
packages = ["mixcheck", "mixcheck.web"]

[tool.setuptools.package-data]
"mixcheck" = ["prompts/*.md"]
"mixcheck.web" = ["static/*"]
