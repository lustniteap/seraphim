name: tests

# Runs the tests on Windows, macOS and Linux, so a change that breaks any of them is caught before it ships.
# Windows runs the real launcher's setup step and starts the real server too.
on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[web,dev]"
      - name: Tests
        run: python tests/test_measurements.py
      - name: Start the real server and use it
        run: python tests/smoke_server.py

  windows-launcher:
    name: Seraphim.bat sets itself up
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the launcher's first-run setup (stops before starting the app)
        shell: cmd
        run: |
          set SERAPHIM_SETUP_ONLY=1
          call Seraphim.bat
          if errorlevel 1 exit /b 1
          if not exist ".venv\Scripts\seraphim-web.exe" (echo seraphim-web.exe was not created & exit /b 1)
          ".venv\Scripts\seraphim-web.exe" --help
